name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Lint + Unit + Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with coverage
        env:
          ENV: development
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          NOTIFICATIONS_ENABLED: "false"
          REDIS_URL: ""
        run: |
          python -m pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -q

      - name: Run integration tests
        env:
          ENV: development
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          NOTIFICATIONS_ENABLED: "false"
          REDIS_URL: ""
        run: |
          python -m pytest tests/integration/ -q --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.14.0"

      - name: helm lint
        run: |
          helm lint deploy/helm/delivery-platform/ \
            --set secret.SECRET_KEY=dummy \
            --set secret.DATABASE_URL=postgresql+asyncpg://u:p@host/db \
            --set secret.REDIS_URL=redis://host:6379

      - name: helm template (dry-run render)
        run: |
          helm template delivery-platform deploy/helm/delivery-platform/ \
            --set secret.SECRET_KEY=dummy \
            --set secret.DATABASE_URL=postgresql+asyncpg://u:p@host/db \
            --set secret.REDIS_URL=redis://host:6379 \
            --debug > /dev/null

      - name: helm template with prod values
        run: |
          helm template delivery-platform deploy/helm/delivery-platform/ \
            -f deploy/helm/delivery-platform/values-prod.yaml \
            --set secret.SECRET_KEY=dummy \
            --set secret.DATABASE_URL=postgresql+asyncpg://u:p@host/db \
            --set secret.REDIS_URL=redis://host:6379 \
            --debug > /dev/null

  # ──────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write   # required by cosign OIDC keyless signing

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Sign image with cosign (keyless OIDC)
        # Sigstore keyless signing: no private key stored in GitHub Secrets.
        # Verification: cosign verify --certificate-identity-regexp="github.com/hneal055"
        #                             --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
        #                             ghcr.io/hneal055/delivery-intelligence-platform@<digest>
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    name: Run Database Migrations
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENV: production
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e SECRET_KEY \
            -e ENV \
            -e REDIS_URL \
            ${{ needs.build-push.outputs.image_ref }} \
            alembic upgrade head