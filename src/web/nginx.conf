# Requests that came through the Cloudflare Tunnel carry CF-Connecting-IP.
# Admin-only pages (API docs, metrics) are refused for those, i.e. for the
# public internet, and stay available on this PC (http://localhost:5173/api/...).
map $http_cf_connecting_ip $from_internet {
    ""      0;
    default 1;
}

# Dynamically set connection header based on whether the client requested an upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver to prevent stale IP caching on container restart
    resolver 127.0.11 valid=10s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA route fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Admin-only pages
    location ^~ /api/docs {
        if ($from_internet) { return 404; }
        set $target http://backend:8000;
        proxy_pass $target/docs;
        proxy_set_header Host $host;
    }
    location ^~ /api/redoc {
        if ($from_internet) { return 404; }
        set $target http://backend:8000;
        proxy_pass $target/redoc;
        proxy_set_header Host $host;
    }
    location ^~ /api/openapi.json {
        if ($from_internet) { return 404; }
        set $target http://backend:8000;
        proxy_pass $target/openapi.json;
        proxy_set_header Host $host;
    }
    location ^~ /api/metrics {
        if ($from_internet) { return 404; }
        set $target http://backend:8000;
        proxy_pass $target/metrics;
        proxy_set_header Host $host;
    }

    # Public package tracking for customers (no login): /track/CCC-XXXXXXXX
    location ^~ /track/ {
        set $target http://backend:8000;
        proxy_pass $target/public/track/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        set $target http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}