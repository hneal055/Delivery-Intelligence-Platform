[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    e2e: end-to-end tests requiring a real PostgreSQL + PostGIS database (skipped in standard CI)

[coverage:run]
omit =
    src/backend/tests/*
