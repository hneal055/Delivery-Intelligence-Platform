# prometheus.yml — minimal scrape config for local development
# In production, use Prometheus Operator CRDs or helm chart values instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - "alerts/delivery-platform.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: delivery-platform
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]