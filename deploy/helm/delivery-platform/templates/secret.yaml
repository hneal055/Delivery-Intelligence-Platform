apiVersion: v1
kind: Secret
metadata:
  name: {{ include "delivery-platform.fullname" . }}-secret
  labels:
    {{- include "delivery-platform.labels" . | nindent 4 }}
  annotations:
    # Manage with external-secrets or sealed-secrets in production.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.DATABASE_URL | quote }}
  SECRET_KEY: {{ .Values.secret.SECRET_KEY | quote }}
  REDIS_URL: {{ .Values.secret.REDIS_URL | quote }}
  SMTP_HOST: {{ .Values.secret.SMTP_HOST | quote }}
  SMTP_USER: {{ .Values.secret.SMTP_USER | quote }}
  SMTP_PASSWORD: {{ .Values.secret.SMTP_PASSWORD | quote }}