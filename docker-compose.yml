networks:
  delivery_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_data:

services:
  delivery_db:
    image: postgis/postgis:15-3.3
    container_name: delivery_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - delivery_net

  delivery_redis:
    image: redis:7-alpine
    container_name: delivery_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - delivery_net

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: delivery_backend:latest
    container_name: delivery_backend
    command: uvicorn src.backend.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@delivery_db:5432/delivery
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DIAD_API_KEY: ${DIAD_API_KEY:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://dip.chicagocargocourier.com}
      COMPANY_NAME: ${COMPANY_NAME:-Chicago Cargo Couriers}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      REDIS_URL: redis://delivery_redis:6379
      CELERY_BROKER_URL: redis://delivery_redis:6379/0
      CELERY_RESULT_BACKEND: redis://delivery_redis:6379/0
    volumes:
      - .:/app
      - app_uploads:/app/uploads
      - app_data:/app/data
    restart: unless-stopped
    depends_on:
      - delivery_db
      - delivery_redis
    networks:
      - delivery_net

  telemetry_worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: delivery_backend:latest
    command: python -m celery -A src.backend.worker.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@delivery_db:5432/delivery
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DIAD_API_KEY: ${DIAD_API_KEY:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      REDIS_URL: redis://delivery_redis:6379
      CELERY_BROKER_URL: redis://delivery_redis:6379/0
      CELERY_RESULT_BACKEND: redis://delivery_redis:6379/0
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - delivery_db
      - delivery_redis
    networks:
      - delivery_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: delivery_tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - delivery_net

  frontend:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    image: delivery_frontend:latest
    container_name: delivery_frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - delivery_net
