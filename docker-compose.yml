version: '3.8'

services:
  backend:
    build: .
    container_name: delivery_backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONPATH=/app
      - SECRET_KEY=production-secret-key-change-me
      - BACKEND_CORS_ORIGINS=http://localhost:8081,http://localhost:3000,http://localhost:5173,*
      - DATABASE_URL=postgresql://postgres:new_postgres_password@db:5432/delivery_db
    volumes:
      - ./src:/app/src
      - ./tools:/app/tools
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: uvicorn src.backend.api.main:app --host 0.0.0.0 --port 8000 --loop asyncio
    restart: always
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: delivery_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=new_postgres_password
      - POSTGRES_DB=delivery_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: delivery_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    container_name: delivery_grafana
    ports:
      - '3500:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_PUBLIC_DASHBOARDS_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:

