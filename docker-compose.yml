version: '3.8'

services:
  backend:
    build: .
    container_name: delivery_backend
    ports:
      - '8002:8000'
    environment:
      - PYTHONPATH=/app
      - SECRET_KEY=production-secret-key-change-me
      - BACKEND_CORS_ORIGINS=http://localhost:8081,http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000
      - DATABASE_URL=postgresql://postgres:new_postgres_password@db:5432/delivery_db
      # S3 Storage (LocalStack for dev)
      - PROOF_STORAGE=local
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=delivery-proofs
      - S3_ENDPOINT_URL=http://localstack:4566
      # Notifications (disabled by default)
      - NOTIFICATIONS_ENABLED=false
      - TWILIO_ACCOUNT_SID=
      - TWILIO_AUTH_TOKEN=
      - TWILIO_FROM_NUMBER=
      - SENDGRID_API_KEY=
      - SENDGRID_FROM_EMAIL=noreply@example.com
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Mapbox (disabled by default)
      - MAPBOX_ACCESS_TOKEN=
    volumes:
      - ./src:/app/src
      - ./tools:/app/tools
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    command: uvicorn src.backend.api.main:app --host 0.0.0.0 --port 8000 --loop asyncio
    restart: always
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: delivery_worker
    environment:
      - PYTHONPATH=/app
      - SECRET_KEY=production-secret-key-change-me
      - DATABASE_URL=postgresql://postgres:new_postgres_password@db:5432/delivery_db
      - REDIS_URL=redis://redis:6379/0
      - PROOF_STORAGE=local
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=delivery-proofs
      - S3_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./src:/app/src
      - ./tools:/app/tools
      - ./migrations:/app/migrations
    command: arq src.backend.worker.main.WorkerSettings --watch src
    restart: always
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: delivery_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=new_postgres_password
      - POSTGRES_DB=delivery_db
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: delivery_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  localstack:
    image: localstack/localstack
    container_name: delivery_localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: delivery_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    container_name: delivery_grafana
    ports:
      - '3500:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PUBLIC_DASHBOARDS_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
  localstack_data:

