version: '3.8'

services:
  backend:
    build: .
    container_name: delivery_backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONPATH=/app
      - SECRET_KEY=production-secret-key-change-me
      - BACKEND_CORS_ORIGINS=http://localhost:8081,http://localhost:3000,*
    volumes:
      - ./src:/app/src
      - ./tools:/app/tools
    # Hardening: Removed --reload for production stability
    command: uvicorn src.backend.api.main:app --host 0.0.0.0 --port 8000
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: delivery_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    container_name: delivery_grafana
    ports:
      - '3500:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PUBLIC_DASHBOARDS_ENABLED=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus

