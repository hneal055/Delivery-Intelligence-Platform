networks:
  delivery_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_data:

services:
  delivery_db:
    image: postgis/postgis:15-3.3
    container_name: delivery_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery
    ports:
      - "127.0.0.1:5432:5432"  # this PC only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - delivery_net

  delivery_redis:
    image: redis:7-alpine
    container_name: delivery_redis
    ports:
      - "127.0.0.1:6379:6379"  # this PC only
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - delivery_net

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: delivery_backend:latest
    container_name: delivery_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@delivery_db:5432/delivery
      # Signs login tokens. Required: set a random value in .env (never the
      # placeholder in config.py, which is public in git).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      # development | production (production refuses unsafe settings)
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DIAD_API_KEY: ${DIAD_API_KEY:-}
      # The dashboard calls the API on its own origin (/api), so this only
      # matters for other browser clients.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      REDIS_URL: redis://delivery_redis:6379
      CELERY_BROKER_URL: redis://delivery_redis:6379/0
      CELERY_RESULT_BACKEND: redis://delivery_redis:6379/0
    volumes:
      - .:/app
      - app_uploads:/app/uploads
      - app_data:/app/data
    restart: unless-stopped
    depends_on:
      - delivery_db
      - delivery_redis
    networks:
      - delivery_net

  telemetry_worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: delivery_backend:latest
    command: python -m celery -A src.backend.worker.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@delivery_db:5432/delivery
      # Signs login tokens. Required: set a random value in .env (never the
      # placeholder in config.py, which is public in git).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      # development | production (production refuses unsafe settings)
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DIAD_API_KEY: ${DIAD_API_KEY:-}
      # The dashboard calls the API on its own origin (/api), so this only
      # matters for other browser clients.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      REDIS_URL: redis://delivery_redis:6379
      CELERY_BROKER_URL: redis://delivery_redis:6379/0
      CELERY_RESULT_BACKEND: redis://delivery_redis:6379/0
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - delivery_db
      - delivery_redis
    networks:
      - delivery_net

  # Public access without opening router ports: Cloudflare Tunnel connects
  # out to Cloudflare and serves https://<your hostname> from the dashboard
  # container (which proxies /api to the backend). Enabled by
  # COMPOSE_PROFILES=tunnel + CLOUDFLARE_TUNNEL_TOKEN in .env, written by
  # scripts/ops/configure-public-access.ps1.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: delivery_tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - delivery_net

  frontend:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    image: delivery_frontend:latest
    container_name: delivery_frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - delivery_net