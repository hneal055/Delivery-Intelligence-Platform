networks:
  delivery_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_data:

services:
  delivery_db:
    image: postgis/postgis:15-3.3
    container_name: delivery_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - delivery_net

  delivery_redis:
    image: redis:7-alpine
    container_name: delivery_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - delivery_net

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: delivery_backend:latest
    container_name: delivery_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@delivery_db:5432/delivery
      REDIS_URL: redis://delivery_redis:6379
      CELERY_BROKER_URL: redis://delivery_redis:6379/0
      CELERY_RESULT_BACKEND: redis://delivery_redis:6379/0
    volumes:
      - .:/app
      - app_uploads:/app/uploads
      - app_data:/app/data
    restart: unless-stopped
    depends_on:
      - delivery_db
      - delivery_redis
    networks:
      - delivery_net

  telemetry_worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: delivery_backend:latest
    command: python -m celery -A src.backend.worker.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@delivery_db:5432/delivery
      REDIS_URL: redis://delivery_redis:6379
      CELERY_BROKER_URL: redis://delivery_redis:6379/0
      CELERY_RESULT_BACKEND: redis://delivery_redis:6379/0
    volumes:
      - .:/app
    restart: unless-stopped
    depends_on:
      - delivery_db
      - delivery_redis
    networks:
      - delivery_net

  frontend:
    build:
      context: ./src-ui
      dockerfile: Dockerfile
    image: delivery_frontend:latest
    container_name: delivery_frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - delivery_net