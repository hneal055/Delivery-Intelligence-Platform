services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service
  # -------------------------------------------------------------
  delivery_db:
    image: postgres:16-alpine
    container_name: delivery_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/schema_analytics.sql:/docker-entrypoint-initdb.d/01_schema_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - delivery_net

  # -------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: delivery_backend
    restart: always
    depends_on:
      delivery_db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@delivery_db:5432/${POSTGRES_DB:-delivery_db}
      API_PORT: 8000
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads
    networks:
      - delivery_net

  # -------------------------------------------------------------
  # Web Dispatcher & Operations Center (Nginx)
  # -------------------------------------------------------------
  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: delivery_web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - delivery_net

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local

networks:
  delivery_net:
    driver: bridge
